<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="500" fill="#222226"/>

  <!-- Vídeo principal (médico) -->
  <rect x="20" y="20" width="620" height="400" rx="8" fill="#3a3a3f" stroke="#555"/>
  <circle cx="330" cy="200" r="55" fill="#5a5a60"/>
  <text x="330" y="207" font-size="14" text-anchor="middle" fill="#bbb">Dra. Ana Souza</text>
  <text x="40" y="405" font-size="12" fill="#999">Cardiologia — 00:12:34</text>

  <!-- Vídeo pequeno (paciente) -->
  <rect x="500" y="290" width="120" height="90" rx="6" fill="#4a4a50" stroke="#666"/>
  <text x="560" y="340" font-size="10" text-anchor="middle" fill="#bbb">Você</text>

  <!-- Painel lateral: prontuário rápido -->
  <rect x="660" y="20" width="120" height="400" rx="6" fill="#2c2c30" stroke="#444"/>
  <text x="720" y="45" font-size="11" text-anchor="middle" fill="#999">Ficha rápida</text>
  <line x1="670" y1="55" x2="770" y2="55" stroke="#444"/>
  <text x="670" y="80" font-size="10" fill="#888">João Pereira</text>
  <text x="670" y="98" font-size="9" fill="#666">42 anos</text>
  <rect x="670" y="115" width="100" height="40" rx="4" fill="#333" stroke="#4a4a4a"/>
  <text x="678" y="130" font-size="8" fill="#888">Última consulta:</text>
  <text x="678" y="145" font-size="8" fill="#888">15/06/2026</text>
  <rect x="670" y="165" width="100" height="60" rx="4" fill="#333" stroke="#4a4a4a"/>
  <text x="678" y="180" font-size="8" fill="#888">Alergias:</text>
  <text x="678" y="195" font-size="8" fill="#888">Dipirona</text>

  <!-- Barra de controles inferior -->
  <rect x="20" y="440" width="620" height="45" rx="22" fill="#2c2c30"/>
  <circle cx="80" cy="462" r="16" fill="#4a4a50"/>
  <text x="80" y="467" font-size="11" text-anchor="middle" fill="#ccc">🎤</text>
  <circle cx="140" cy="462" r="16" fill="#4a4a50"/>
  <text x="140" y="467" font-size="11" text-anchor="middle" fill="#ccc">🎥</text>
  <circle cx="200" cy="462" r="16" fill="#4a4a50"/>
  <text x="200" y="467" font-size="10" text-anchor="middle" fill="#ccc">💬</text>
  <rect x="500" y="450" width="120" height="26" rx="13" fill="#7a3535"/>
  <text x="560" y="467" font-size="11" text-anchor="middle" fill="#eee">Encerrar</text>

  <text x="400" y="493" font-size="11" text-anchor="middle" fill="#666">Wireframe de baixa fidelidade — Sala de Teleconsulta</text>
</svg>
